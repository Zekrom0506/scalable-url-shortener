worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 20000;   # 7,000 client conns + upstream conns per worker
    multi_accept on;
}

http {
    access_log off;             # logging every request would dominate CPU under load
    sendfile on;
    tcp_nodelay on;
    keepalive_requests 100000;

    upstream backend_servers {
        # Consistent hashing over the client connection (addr:port). All API calls
        # share one URI (/generate_url), so hashing on $request_uri would pin every
        # request to a single backend; hashing per connection spreads load evenly
        # and keeps each client sticky, with minimal remapping if a backend drops.
        hash $remote_addr$remote_port consistent;
        server backend1:8000 max_fails=3 fail_timeout=30s;
        server backend2:8000 max_fails=3 fail_timeout=30s;
        server backend3:8000 max_fails=3 fail_timeout=30s;
        keepalive 300;          # pool of idle keepalive connections to the backends
        keepalive_requests 100000;
    }

    server {
        listen 80 reuseport backlog=65535;
        server_name rustyshortener;

        # Docker's embedded DNS, so nginx starts even when the optional frontend is off
        resolver 127.0.0.11 valid=30s ipv6=off;

        location ~ ^/(generate_url|custom_url|dns_resolver|ping|metrics) {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";   # required for upstream keepalive
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_next_upstream error timeout;
        }

        location / {
            set $frontend http://frontend:3000;
            proxy_pass $frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
